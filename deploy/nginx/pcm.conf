# Nginx site for the PCM website.
# Install:  sudo cp pcm.conf /etc/nginx/sites-available/pcm
#           sudo ln -s /etc/nginx/sites-available/pcm /etc/nginx/sites-enabled/pcm
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow image/PDF uploads through the Django admin.
    client_max_body_size 10M;

    # Level 1: Nginx serves static and media files straight from disk.
    # From Level 2 the HTML points to S3 instead, so these blocks stop being used.
    location /static/ {
        alias /srv/pcm-website/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/pcm-website/app/media/;
        expires 1d;
    }

    # Everything else goes to Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
